spring.config.import=optional:classpath:application-secret.properties
spring.application.name=backend

# Database (set DB_URL / DB_USER / DB_PASSWORD as environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerbridge_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Python agent service
agent.base-url=${AGENT_BASE_URL:http://localhost:8000}
agent.connect-timeout-ms=5000
agent.read-timeout-ms=90000

# Login tokens (JWT_SECRET is required: at least 32 characters)
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-hours=12

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081

# allow PDF resume uploads up to 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB